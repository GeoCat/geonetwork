server:
  port: 8888

geonetwork:
  security:
    provider: database
    passwordSalt: secret-hash-salt=
    databaseUserAuthProperty: USERNAME_OR_EMAIL

debug: true

spring:
  application:
    name: config-server
  profiles:
    active: jdbc
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/geonetwork}
    username: ${JDBC_DATABASE_USERNAME:geonetwork}
    password: ${JDBC_DATABASE_PASSWORD:geonetwork}
    driver-class-name: ${JDBC_DATABASE_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    config:
      server:
        jdbc:
          sql: SELECT CONFIG_PARAM, CONFIG_VALUE from APP_CONFIGS where LOWER(APP)=LOWER(?) and PROFILE=? and LABEL=?
          order: 1

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

